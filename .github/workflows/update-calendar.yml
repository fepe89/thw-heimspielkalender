name: THW-Heimspielkalender aktualisieren

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Kalender neu erzeugen
        run: python update_calendar.py

      - name: Repository wöchentlich aktiv halten
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            date -u +"Letzte erfolgreiche Prüfung: %Y-%m-%dT%H:%M:%SZ" \
              > .last-successful-check
          fi

      - name: Änderungen veröffentlichen
        run: |
          if git diff --quiet -- thw-kiel-heimspiele.ics .last-successful-check; then
            echo "Keine Terminänderung."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thw-kiel-heimspiele.ics .last-successful-check
          git commit -m "Kalender automatisch aktualisieren"
          git push
